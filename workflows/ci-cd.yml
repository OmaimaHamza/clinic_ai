name: CI/CD

on:
  push:
  pull_request:

jobs:
  lint:
    name: 1 - Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install flake8
      # Erreurs bloquantes : syntaxe, noms non définis
      - run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.git,venv,.venv
      # Style : avertissements seulement
      - run: flake8 . --count --exit-zero --max-line-length=120 --exclude=.git,venv,.venv

  test:
    name: 2 - Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - run: pytest -v

  build:
    name: 3 - Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Vérifier que tout le code compile
        run: python -m compileall -q .
      - name: Créer l'archive du projet
        run: |
          mkdir dist
          git archive --format=zip --output=dist/app.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: dist/app.zip

  deploy:
    name: 4 - Deploy
    runs-on: ubuntu-latest
    needs: build
    # On ne déploie que depuis preproduction ou main (pas depuis les PR)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/preproduction' || github.ref == 'refs/heads/main')
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preproduction' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-build
      - name: Déployer (à adapter à votre plateforme)
        run: |
          echo "Déploiement de la version validée sur ${{ github.ref_name }}"
          # Exemples à adapter :
          # - Render / Streamlit Cloud : appeler un deploy hook
          #   curl -X POST "${{ secrets.DEPLOY_HOOK_URL }}"
          # - Serveur SSH : scp + ssh
